name: Deploy TestFlight
on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to deploy'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-ios
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" == ios-v* ]]
          GITHUB_REF_NAME="$RELEASE_TAG" python3 scripts/verify_release.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
          bundler-cache: true
      - name: Restore signing and Firebase files
        env:
          API_KEY: ${{ secrets.APP_STORE_API_KEY_BASE64 }}
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          FIREBASE: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          umask 077
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          printf '%s' "$FIREBASE" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - run: bundle exec fastlane ios deploy_testflight
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          IOS_CERTIFICATE_PATH: ${{ runner.temp }}/distribution.p12
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROFILE_PATH: ${{ runner.temp }}/appstore.mobileprovision
      - name: Remove signing files and temporary keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/appstore.mobileprovision" ios/Runner/GoogleService-Info.plist
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/158d6c9e-898d-4308-b19b-702723a7cfa7.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/158d6c9e-898d-4308-b19b-702723a7cfa7.mobileprovision"
          security delete-keychain fastlane_tmp_keychain || true
